<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dekor Es Medya | Pro Otomotiv Aksesuar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Navigasyon -->
    <header class="navbar">
        <div class="logo">DEKOR ES <span>MEDYA</span></div>
        <div class="nav-right">
            <button id="authBtn" class="auth-btn">Giriş / Kayıt Ol</button>
            <div id="userProfile" class="user-profile" style="display: none;">
                <span id="userNameDisplay">Hesabım</span>
                <button id="logoutBtn" class="logout-sm">Çıkış</button>
            </div>
        </div>
    </header>

    <!-- Hero Alanı -->
    <div class="hero-shop">
        <h1>Pro Aksesuar Vitrini</h1>
        <p>Aracınız için en özel parçalar, doğrudan WhatsApp sipariş hattında.</p>
    </div>

    <!-- Kategori Filtreleri -->
    <div class="category-bar">
        <button class="cat-btn active" onclick="filterCategory('all')">Tümü</button>
        <button class="cat-btn" onclick="filterCategory('jant')">Jant & Dış</button>
        <button class="cat-btn" onclick="filterCategory('ic')">İç Kabin</button>
        <button class="cat-btn" onclick="filterCategory('isik')">Işıklandırma</button>
    </div>

    <!-- Ürünler Izgarası (20 Adet) -->
    <main class="product-grid" id="productGrid">
        <!-- JS ile dolacak -->
    </main>

    <!-- Sabit Alt Bar / Sepet Özeti -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span id="cartCount">0 Ürün Seçildi</span>
            <span class="cart-total">Teklif İçin Hazır</span>
        </div>
        <button id="openCartModalBtn" class="whatsapp-btn">
            🛒 Sepeti Gör & Teklif Al
        </button>
    </div>

    <!-- Ürün Detay Modalı -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeDetail">&times;</span>
            <div class="modal-img-big">🛞</div>
            <h2 id="detailTitle">Ürün Adı</h2>
            <p id="detailDesc" class="detail-desc">Ürün açıklaması burada yer alacak.</p>
            <div class="specs-box">
                <span>Uyumlu Modeller: <strong id="detailCompat">Tüm Araçlar</strong></span>
            </div>
            <button id="modalActionBtn" class="submit-btn">Sepete Ekle</button>
        </div>
    </div>

    <!-- Sepet & Teklif Onay Modalı -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeCartModal">&times;</span>
            <h2>Sipariş / Teklif Özeti</h2>
            <div id="cartItemList" class="cart-item-list">
                <!-- Seçilen ürünler listelenecek -->
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Özel Sipariş / Notunuz (İsteğe Bağlı)</label>
                <textarea id="orderNote" placeholder="Örn: Broadway uyumlu olsun, siyah renk..." rows="2"></textarea>
            </div>
            <button id="sendWhatsappOrderBtn" class="whatsapp-btn-full">
                💬 WhatsApp ile Gönder (0551 144 14 95)
            </button>
        </div>
    </div>

    <!-- Giriş / Kayıt Modalı -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2 id="modalTitle">Giriş Yap</h2>
            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Ad Soyad</label>
                    <input type="text" id="fullName" placeholder="Adınız Soyadınız">
                </div>
                <div class="form-group">
                    <label>E-Posta veya Telefon</label>
                    <input type="text" id="emailInput" placeholder="ornek@mail.com" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="passInput" placeholder="******" required>
                </div>
                <button type="submit" class="submit-btn" id="submitAuthBtn">Giriş Yap</button>
                <p class="switch-auth" id="switchAuthText">Hesabın yok mu? <span>Kayıt ol</span></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
