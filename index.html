<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro Arşiv | Dijital Sinema & Dizi Merkezi</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --card-hover: #1f2937;
            --accent: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.25);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 40px 16px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Header & Logo */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), #ff4d4d);
            color: white;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* İstatistik & Progress Bar Kartı */
        .stats-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .stats-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stats-info span:last-child {
            color: var(--accent);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #ff4d4d);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 4px;
        }

        /* Arama Kutusu */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Klasör (Details) Tasarımı */
        details {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 14px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        details[open] {
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 12px 25px var(--accent-glow);
        }

        summary {
            padding: 18px 20px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            transition: background 0.2s;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary:hover {
            background-color: var(--card-hover);
        }

        summary::after {
            content: "";
            width: 7px;
            height: 7px;
            border-right: 2px solid var(--accent);
            border-bottom: 2px solid var(--accent);
            transform: rotate(45deg);
            transition: transform 0.3s ease;
            margin-right: 4px;
        }

        details[open] summary::after {
            transform: rotate(-135deg);
        }

        .content {
            padding: 6px 16px 16px 16px;
            border-top: 1px solid var(--border);
            background: rgba(3, 7, 18, 0.5);
        }

        /* Liste Öğeleri */
        .item {
            display: flex;
            align-items: center;
            margin-top: 10px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            transition: all 0.2s;
        }

        .item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* Checkbox */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #4b5563;
            border-radius: 7px;
            margin-right: 14px;
            cursor: pointer;
            position: relative;
            background: transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        input[type="checkbox"]:checked {
            background-color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 13px;
            font-weight: 900;
        }

        label {
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
            width: 100%;
            transition: color 0.2s;
            line-height: 1.4;
        }

        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #4b5563;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            font-size: 12px;
            color: #4b5563;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-badge">Pro Sürüm v3.0</div>
        <h1>DİJİTAL ARŞİV</h1>
    </div>

    <!-- İlerleme ve İstatistik Kartı -->
    <div class="stats-card">
        <div class="stats-info">
            <span>İzleme İlerlemesi</span>
            <span id="progress-text">%0 Tamamlandı</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Arama Çubuğu -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Arşivde dizi veya film ara...">
    </div>

    <!-- 1. KLASÖR: KURTLAR VADİSİ -->
    <details class="archive-category">
        <summary>🐺 Kurtlar Vadisi Evreni</summary>
        <div class="content">
            <div class="item"><input type="checkbox" id="kv1" class="app-checkbox"><label for="kv1">Kurtlar Vadisi (1-97. Bölüm)</label></div>
            <div class="item"><input type="checkbox" id="kv2" class="app-checkbox"><label for="kv2">Kurtlar Vadisi: Irak (Film)</label></div>
            <div class="item"><input type="checkbox" id="kv3" class="app-checkbox"><label for="kv3">Kurtlar Vadisi Terör (1-2. Bölüm)</label></div>
            <div class="item"><input type="checkbox" id="kv4" class="app-checkbox"><label for="kv4">Kurtlar Vadisi Pusu (1-49. Bölüm)</label></div>
            <div class="item"><input type="checkbox" id="kv5" class="app-checkbox"><label for="kv5">Muro: Nalet Olsun İçimdeki İnsan Sevgisine</label></div>
            <div class="item"><input type="checkbox" id="kv6" class="app-checkbox"><label for="kv6">Kurtlar Vadisi Pusu (50-71. Bölüm)</label></div>
            <div class="item"><input type="checkbox" id="kv7" class="app-checkbox"><label for="kv7">Kurtlar Vadisi: Gladio (Film)</label></div>
            <div class="item"><input type="checkbox" id="kv8" class="app-checkbox"><label for="kv8">Kurtlar Vadisi Pusu (72-110. Bölüm)</label></div>
            <div class="item"><input type="checkbox" id="kv9" class="app-checkbox"><label for="kv9">Kurtlar Vadisi: Filistin (Film)</label></div>
            <div class="item"><input type="checkbox" id="kv10" class="app-checkbox"><label for="kv10">Kurtlar Vadisi Pusu (111-300. Bölüm)</label></div>
            <div class="item"><input type="checkbox" id="kv11" class="app-checkbox"><label for="kv11">Kurtlar Vadisi: Vatan (Film)</label></div>
        </div>
    </details>

    <!-- 2. KLASÖR: SON YAZ (TÜRK DİZİSİ) -->
    <details class="archive-category">
        <summary>🌊 Son Yaz (Türk Dizisi)</summary>
        <div class="content">
            <div class="item"><input type="checkbox" id="sy1" class="app-checkbox"><label for="sy1">1. Sezon 1. Bölüm (Pilot)</label></div>
            <div class="item"><input type="checkbox" id="sy2" class="app-checkbox"><label for="sy2">1. Sezon 2. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy3" class="app-checkbox"><label for="sy3">1. Sezon 3. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy4" class="app-checkbox"><label for="sy4">1. Sezon 4. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy5" class="app-checkbox"><label for="sy5">1. Sezon 5. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy6" class="app-checkbox"><label for="sy6">1. Sezon 6. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy7" class="app-checkbox"><label for="sy7">1. Sezon 7. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy8" class="app-checkbox"><label for="sy8">1. Sezon 8. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy9" class="app-checkbox"><label for="sy9">1. Sezon 9. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy10" class="app-checkbox"><label for="sy10">1. Sezon 10. Bölüm</label></div>
            <div class="item"><input type="checkbox" id="sy11" class="app-checkbox"><label for="sy11">1. Sezon 11-21. Bölümler (Sezon Finali)</label></div>
            <div class="item"><input type="checkbox" id="sy12" class="app-checkbox"><label for="sy12">2. Sezon 22-26. Bölümler (Final)</label></div>
        </div>
    </details>

    <!-- 3. KLASÖR: EFSANE YABANCI DİZİLER -->
    <details class="archive-category">
        <summary>🔥 Efsane Yabancı Diziler</summary>
        <div class="content">
            <div class="item"><input type="checkbox" id="yd1" class="app-checkbox"><label for="yd1">Breaking Bad (Tüm Sezonlar)</label></div>
            <div class="item"><input type="checkbox" id="yd2" class="app-checkbox"><label for="yd2">Prison Break (1. Sezon)</label></div>
            <div class="item"><input type="checkbox" id="yd3" class="app-checkbox"><label for="yd3">Peaky Blinders (Tüm Sezonlar)</label></div>
            <div class="item"><input type="checkbox" id="yd4" class="app-checkbox"><label for="yd4">Game of Thrones (Tüm Sezonlar)</label></div>
        </div>
    </details>

    <!-- 4. KLASÖR: FAVORİ SİNEMA FİLMLERİ -->
    <details class="archive-category">
        <summary>🎞️ Favori Sinema Filmleri</summary>
        <div class="content">
            <div class="item"><input type="checkbox" id="ff1" class="app-checkbox"><label for="ff1">Interstellar (Yıldızlararası)</label></div>
            <div class="item"><input type="checkbox" id="ff2" class="app-checkbox"><label for="ff2">Inception (Başlangıç)</label></div>
            <div class="item"><input type="checkbox" id="ff3" class="app-checkbox"><label for="ff3">The Godfather (Baba)</label></div>
            <div class="item"><input type="checkbox" id="ff4" class="app-checkbox"><label for="ff4">Fight Club (Dövüş Kulübü)</label></div>
            <div class="item"><input type="checkbox" id="ff5" class="app-checkbox"><label for="ff5">Gladiator (Gladyatör)</label></div>
        </div>
    </details>

    <div class="footer">
        İnteraktif Web Uygulaması &bull; v3.0
    </div>

    <!-- JavaScript: Hafıza, İlerleme ve Arama Sistemi -->
    <script>
        const checkboxes = document.querySelectorAll('.app-checkbox');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const searchInput = document.getElementById('searchInput');
        const items = document.querySelectorAll('.item');
        const categories = document.querySelectorAll('.archive-category');

        // 1. Sayfa açıldığında hafızadan (localStorage) tikleri yükle
        checkboxes.forEach(checkbox => {
            const savedState = localStorage.getItem(checkbox.id);
            if (savedState === 'true') {
                checkbox.checked = true;
            }

            // Tik değiştikçe hafızaya kaydet ve ilerleme çubuğunu güncelle
            checkbox.addEventListener('change', () => {
                localStorage.setItem(checkbox.id, checkbox.checked);
                updateProgress();
            });
        });

        // 2. İlerleme yüzdesini hesapla ve göster
        function updateProgress() {
            const total = checkboxes.length;
            let checkedCount = 0;
            checkboxes.forEach(cb => {
                if (cb.checked) checkedCount++;
            });
            const percentage = Math.round((checkedCount / total) * 100);
            progressFill.style.width = percentage + '%';
            progressText.innerText = `%${percentage} Tamamlandı (${checkedCount}/${total})`;
        }

        // Başlangıçta ilerlemeyi hesapla
        updateProgress();

        // 3. Canlı Arama / Filtreleme Sistemi
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();

            if (term === '') {
                items.forEach(item => item.style.display = 'flex');
                categories.forEach(cat => {
                    cat.style.display = 'block';
                    cat.open = false; // Aramadan çıkınca klasörleri kapat
                });
                return;
            }

            categories.forEach(cat => {
                let matchFoundInCat = false;
                const catItems = cat.querySelectorAll('.item');

                catItems.forEach(item => {
                    const text = item.querySelector('label').textContent.toLowerCase();
                    if (text.includes(term)) {
                        item.style.display = 'flex';
                        matchFoundInCat = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                if (matchFoundInCat) {
                    cat.style.display = 'block';
                    cat.open = true; // Eşleşme varsa klasörü otomatik aç
                } else {
                    cat.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
