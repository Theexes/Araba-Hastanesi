<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dekor Es Medya | Otomotiv Aksesuar Mağazası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Navigasyon -->
    <header class="navbar">
        <div class="logo">DEKOR ES <span>MEDYA</span></div>
        <div class="nav-right">
            <button id="authBtn" class="auth-btn">Giriş / Kayıt Ol</button>
            <div id="userProfile" class="user-profile" style="display: none;">
                <span id="userNameDisplay">Hesabım</span>
                <button id="logoutBtn" class="logout-sm">Çıkış</button>
            </div>
        </div>
    </header>

    <!-- Ana Vitrin Header -->
    <div class="hero-shop">
        <h1>Pro Aksesuar Vitrini</h1>
        <p>Aracınız için en özel parçalar, doğrudan WhatsApp sipariş hattında.</p>
    </div>

    <!-- Ürünler Izgarası (20 Adet) -->
    <main class="product-grid" id="productGrid">
        <!-- JavaScript ile otomatik doldurulacak -->
    </main>

    <!-- Sepet / Teklif Sabit Alt Barı -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <span id="cartCount">0 Ürün Seçildi</span>
            <span class="cart-total">Özel Teklif Bekliyor</span>
        </div>
        <button id="whatsappBtn" class="whatsapp-btn">
            💬 WhatsApp ile Teklif Al
        </button>
    </div>

    <!-- Giriş / Kayıt Modalı (Penceresi) -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2 id="modalTitle">Giriş Yap</h2>
            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Ad Soyad</label>
                    <input type="text" id="fullName" placeholder="Adınız Soyadınız">
                </div>
                <div class="form-group">
                    <label>E-Posta veya Telefon</label>
                    <input type="text" id="emailInput" placeholder="ornek@mail.com" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="passInput" placeholder="******" required>
                </div>
                <button type="submit" class="submit-btn" id="submitAuthBtn">Giriş Yap</button>
                <p class="switch-auth" id="switchAuthText">Hesabın yok mu? <span>Kayıt ol</span></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
